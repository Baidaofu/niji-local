plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nijilocal.module'
    compileSdk 35

    defaultConfig {
        applicationId "com.nijilocal.module"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += 'META-INF/*'
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
