name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build LSPosed module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest runner already ships the Android SDK
      # (ANDROID_HOME=/usr/local/lib/android/sdk), so no setup-android step.
      - name: Build
        working-directory: lsposed
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: niji-local-module
          path: lsposed/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
